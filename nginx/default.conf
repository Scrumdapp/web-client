server {
    listen 80;
    server_name localhost;
    root /var/www/web;
    index index.html;

    location ~* \.(jpg|jpeg|webp|png|gif|ico|css|js|pdf)$ {
       access_log        off;
       add_header        Cache-Control max-age=604800;
    }

    location / {
        try_files $uri /index.html;
    }
}
